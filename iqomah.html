<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iqomah - Masjid Al-Falah</title>
    <style>
        :root {
            --accent: #34e89e;
            --gold: #f1c40f;
            --danger: #ff4757;
        }

        body { 
            /* Menggunakan background yang sama dengan dashboard utama agar konsisten */
            background: linear-gradient(rgba(0,0,0,0.8), rgba(0,0,0,0.8)), 
                        url('./img/pexels-tarik-sami-2136439315-33169796.jpg') no-repeat center center/cover;
            color: white; 
            height: 100vh; 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center; 
            font-family: 'Segoe UI', Roboto, sans-serif;
            overflow: hidden;
            margin: 0;
        }

        /* Container utama dengan efek kaca (Glassmorphism) */
        .glass-container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 60px 100px;
            border-radius: 40px;
            text-align: center;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
        }

        h1 { 
            font-size: 3.5rem; 
            color: white; 
            letter-spacing: 8px; 
            margin-bottom: 30px; 
            text-transform: uppercase;
            font-weight: 300;
        }

        h1 span {
            color: var(--accent);
            font-weight: 800;
        }

        #timer { 
            font-size: 18rem; /* Sangat besar dan tegas */
            font-weight: 900; 
            font-family: 'Courier New', Courier, monospace; 
            line-height: 0.9;
            color: var(--gold);
            text-shadow: 0 10px 30px rgba(0,0,0,0.5);
            margin: 20px 0;
        }

        .status-text {
            font-size: 2rem;
            letter-spacing: 4px;
            color: #a7ffeb;
            margin-top: 20px;
            text-transform: uppercase;
        }

        /* Efek saat waktu hampir habis */
        .warning { 
            color: var(--danger) !important; 
            animation: blink 1s infinite; 
            text-shadow: 0 0 50px rgba(239, 68, 68, 0.5) !important;
        }

        @keyframes blink { 
            0% { opacity: 1; transform: scale(1); } 
            50% { opacity: 0.7; transform: scale(1.02); } 
            100% { opacity: 1; transform: scale(1); } 
        }

        /* Penyesuaian Tablet */
        @media (max-width: 1024px) {
            h1 { font-size: 2rem; }
            #timer { font-size: 10rem; }
            .glass-container { padding: 40px; width: 80%; }
        }
    </style>
</head>
<body>

    <div class="glass-container">
        <h1>WAKTU <span>ADZHAN & IQOMAH</span></h1>
        
        <div id="timer">00:10</div>
        
        <div class="status-text">Menuju Ibadah Shalat</div>
    </div>

    <script>
        // LOGIKA TETAP SAMA (TIDAK BERUBAH)
        let s = 10 * 60, m = 10; 
        const el = document.getElementById('timer');
        
        function playBeep(frequency = 440, duration = 0.2) {
            const context = new (window.AudioContext || window.webkitAudioContext)();
            const oscillator = context.createOscillator();
            const gainNode = context.createGain();

            oscillator.type = 'sine';
            oscillator.frequency.setValueAtTime(frequency, context.currentTime);
            
            gainNode.gain.setValueAtTime(0.1, context.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, context.currentTime + duration);

            oscillator.connect(gainNode);
            gainNode.connect(context.destination);

            oscillator.start();
            oscillator.stop(context.currentTime + duration);
        }

        const count = setInterval(() => {
            s--;
            let m = Math.floor(s/60);
            let sec = s % 60;
            
            el.textContent = `${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;

            if (s <= 10) el.classList.add('warning');

            if (s <= 5 && s > 0) {
                playBeep(660, 0.1); 
            }

            if (s === 0) {
                playBeep(880, 1.5); 
                clearInterval(count);
                setTimeout(() => {
                    window.location.href = "index.html";
                }, 20000);
            }
        }, 1000);
    </script>
</body>
</html>
